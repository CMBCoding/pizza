<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="images/favicon.svg" type="image/x-icon">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/pizzastyles.css">
</head>
<body>
    <!-- Main -->
    <div id="main">

        <!-- Header -->
        <div id="header">
            <img src="images/pizzaguy.webp" alt="radical pizza guy mascot">
            <h1>Welcome to [Name Pending]</h1>
            <h2>Serving GRC Students for over 50 years!</h2>
            <hr>
            <p>We make the best pizza in town. Visit us today!</p>
            <a href="#" id="contact-btn" role="button">Contact Us</a>
        </div>

        <!-- Pizza Form -->
        <form action="#" method="get" id="pizza-form">
            <!-- Contact Info -->
            <fieldset>
                <legend>Contact Info</legend>
                <label for="fname">First Name</label>
                <input type="text" name="fname" id="fname">

                <label for="lname">Last Name</label>
                <input type="text" name="lname" id="lname">

                <label for="email">Email</label>
                <input type="email" name="email" id="email">
            </fieldset>

            <!-- Pickup or Delivery -->
             <fieldset>
                <legend>Pickup or Delivery</legend>
                
                <label for="pickup">
                    <input type="radio" name="method" id="pickup" value="pickup">
                    Pickup
                </label>
                
                <label for="delivery">
                    <input type="radio" name="method" id="delivery" value="delivery">
                    Delivery
                </label>

             </fieldset>

            <!-- Order button -->
            <button type="submit" id="order-button">Place Order</button>
        </form>
    </div>
</body>
</html>
